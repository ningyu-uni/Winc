name: Release · Linux x64 AppImage (glibc 2.28)

# An AppImage for systems older than the runner image that the regular Release · Linux x64
# workflow builds on (Ubuntu 24.04, glibc 2.39): AlmaLinux 8 (glibc 2.28) hosts the whole build
# in a container, so the binaries record no glibc symbol version above 2.28 and the AppImage
# runs on RHEL/Rocky/Alma 8, Debian 10 and anything newer. The regular workflow keeps building
# the distribution packages; this one adds the standalone AppImage only.
#
# The same build runs locally with release/linux/appimage-glibc228/run.sh.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Any 8.x image keeps glibc 2.28 (the EL8 ABI); the point release pins the rest of the system.
  IMAGE: almalinux:8.10

jobs:
  build:
    name: Build in glibc 2.28
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # No compilation cache: release builds start from a clean slate, as in the regular release.
      # GITHUB_TOKEN passes to the tool downloads, which pin GitHub release assets by SHA-256.
      - name: Build the AppImage in the container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e GITHUB_TOKEN \
            "$IMAGE" bash release/linux/appimage-glibc228/build.sh

      # A fresh container with no build tooling: the AppImage must run on a bare glibc 2.28
      # system, not just on the machine that built it.
      - name: Verify in a pristine glibc 2.28 container
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            "$IMAGE" bash release/linux/appimage-glibc228/verify.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-linux-x64-appimage-glibc228
          path: target/x86_64-unknown-linux-gnu/release/bundle/appimage-glibc228/
          compression-level: 0
          if-no-files-found: error
